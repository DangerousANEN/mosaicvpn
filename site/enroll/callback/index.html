<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Открыть MosaicVPN</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1620; --surface:#122534; --line:#24465c; --text:#eef7fb; --muted:#a8bfcc; --accent:#72d5c5; --error:#ffaaa6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 0%,#193e50 0,transparent 40%),var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,520px); background:rgba(18,37,52,.94); border:1px solid var(--line); border-radius:20px; padding:28px; }
    .brand { color:var(--accent); font-weight:700; letter-spacing:.04em; }
    h1 { margin:12px 0 10px; font-size:clamp(24px,7vw,34px); line-height:1.15; }
    p { color:var(--muted); margin:0 0 20px; }
    .button { display:block; width:100%; padding:14px 18px; border:0; border-radius:12px; background:var(--accent); color:#062229; font:700 16px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; text-decoration:none; cursor:pointer; }
    .note { margin-top:16px; font-size:14px; }
    .error { color:var(--error); }
  </style>
</head>
<body>
  <main>
    <div class="brand">MosaicVPN</div>
    <h1>Откройте приложение</h1>
    <p id="message">Подготовили добавление подписки и кабинета. Нажмите кнопку, чтобы передать его в MosaicVPN.</p>
    <a id="open-app" class="button" href="/">Открыть MosaicVPN</a>
    <p class="note">Если приложение не открывается, установите актуальную версию MosaicVPN и повторите действие из кабинета.</p>
  </main>
  <script>
    (function () {
      'use strict';
      var parameters = new URLSearchParams(window.location.search);
      var code = parameters.get('code') || '';
      var state = parameters.get('state') || '';
      var valid = /^[A-Za-z0-9_-]{16,128}$/.test(code) && /^[A-Za-z0-9]{16,128}$/.test(state);
      var link = document.getElementById('open-app');
      var message = document.getElementById('message');
      if (!valid) {
        link.hidden = true;
        message.textContent = 'Ссылка добавления неполная или уже недействительна. Вернитесь в кабинет и повторите действие.';
        message.className = 'error';
        return;
      }
      link.href = 'mosaicvpn://enroll/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
    })();
  </script>
</body>
</html>
