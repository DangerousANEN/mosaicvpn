[package]
name = "mosaicvpn-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mosaicvpn"
path = "src/main.rs"

[dependencies]
slint = "1.8"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dirs = "5"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
