# ==============================================================================
# MosaicVPN & Remnawave Production Stack
# 1-Click Disaster Recovery Compose Configuration
# ==============================================================================

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always

x-networks: &networks
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

x-env: &env
  env_file: .env

services:
  remnawave-db:
    image: postgres:15
    container_name: 'remnawave-db'
    hostname: remnawave-db
    <<: [*common, *logging, *env, *networks]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - PGDATA=/var/lib/postgresql/data
      - TZ=UTC
    ports:
      - '127.0.0.1:6767:5432'
    volumes:
      - remnawave-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 5

  remnawave:
    image: remnawave/backend:2
    container_name: remnawave
    hostname: remnawave
    <<: [*common, *logging, *env, *networks]
    volumes:
      - valkey-socket:/var/run/valkey
    ports:
      - '0.0.0.0:3000:${APP_PORT:-3000}'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

  remnawave-redis:
    image: valkey/valkey:7.2
    container_name: remnawave-redis
    hostname: remnawave-redis
    <<: [*common, *logging, *networks]
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave-nginx:
    image: nginx:1.24
    container_name: remnawave-nginx
    hostname: remnawave-nginx
    <<: [*common, *logging]
    networks:
      - remnawave-network
    depends_on:
      - remnawave
      - remnawave-subscription-page
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/panel.zxc1x1.ru/fullchain.pem:/etc/nginx/ssl/panel.zxc1x1.ru/fullchain.pem:ro
      - ./nginx/ssl/panel.zxc1x1.ru/privkey.pem:/etc/nginx/ssl/panel.zxc1x1.ru/privkey.pem:ro
      - ./nginx/ssl/sub.zxc1x1.ru/fullchain.pem:/etc/nginx/ssl/sub.zxc1x1.ru/fullchain.pem:ro
      - ./nginx/ssl/sub.zxc1x1.ru/privkey.pem:/etc/nginx/ssl/sub.zxc1x1.ru/privkey.pem:ro
      - ./nginx/ssl/cdn.zxc1x1.ru/fullchain.pem:/etc/nginx/ssl/cdn.zxc1x1.ru/fullchain.pem:ro
      - ./nginx/ssl/cdn.zxc1x1.ru/privkey.pem:/etc/nginx/ssl/cdn.zxc1x1.ru/privkey.pem:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www:/var/www:ro

  remnawave-subscription-page:
    image: remnawave/subscription-page:latest
    container_name: remnawave-subscription-page
    hostname: remnawave-subscription-page
    <<: [*common, *logging, *networks, *env]
    depends_on:
      remnawave:
        condition: service_healthy
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - REMNAWAVE_PANEL_URL=http://remnawave:3000
      - APP_PORT=3010
      - REMNAWAVE_API_TOKEN=${REMNAWAVE_API_TOKEN}
    ports:
      - '0.0.0.0:3010:3010'
    volumes:
      - ./index.html:/opt/app/frontend/index.html:ro

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false

volumes:
  remnawave-db-data:
  valkey-socket:
