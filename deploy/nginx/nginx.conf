        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
        tcp_nodelay on;
        client_max_body_size 0;
    }

    location /mosaicws {
        proxy_pass http://172.18.0.1:4460;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
        tcp_nodelay on;
    }

    location /direct {
        proxy_pass http://172.18.0.1:4443;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
        tcp_nodelay on;
        client_max_body_size 0;
    }

    location /stats-api {
        proxy_pass http://172.18.0.1:12223;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        root /etc/letsencrypt/landing;
        index index.html;
    }

    location = /index.html {
        root /etc/letsencrypt/landing;
    }

    # landing static pages (docs + legal pages required by the payment provider).
    # Must stay ABOVE `location /` or these paths get proxied to the subscription
    # backend and return 404.
    # Web cabinet API - proxy to bot on port 12223
    location /api/ {
        proxy_pass http://172.18.0.1:12223;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|manual|setup|cabinet|payment|admin|contacts|offer|privacy|refund|terms|delivery|atlas|seo|seo-panel)\.html$ {
        root /etc/letsencrypt/landing;
    }

    location = /seo-report.json {
        root /etc/letsencrypt/landing;
    }

    location ^~ /blog/ {
        root /etc/letsencrypt/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ^~ /assets/ {
        root /etc/letsencrypt/landing;
        try_files $uri $uri/ =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|facts\.json)$ {
        root /etc/letsencrypt/landing;
    }

    location = /.well-known/ai-instructions.txt {
        root /etc/letsencrypt/landing;
    }

    # Do not expose the legacy subscription HTML page to browser visitors.
    # The location is intentionally after static routes and /api, so normal
    # public pages and authorised cabinet endpoints retain their exact paths.
    location / {
        if ($mosaic_subscription_browser) {
            return 302 /cabinet.html?from=subscription-link;
        }
        proxy_http_version 1.1;
        proxy_pass http://json;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

