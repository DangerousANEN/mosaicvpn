server_names_hash_bucket_size 128;

upstream remnawave {
    server remnawave:3000;
}

upstream json {
    server remnawave-subscription-page:3010;
    server remnawave-subscription-page:3010;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    # XHTTP uses long-lived POST/PUT streams without WebSocket Upgrade.
    # Do not force Connection: close on those requests.
    ""      "";
}
# A browser asks for HTML, whereas subscription clients request a raw profile.
# Redirecting only HTML requests prevents the legacy subscription page from being
# used as a customer panel while retaining direct imports for supported clients.
map $http_accept $mosaic_subscription_browser {
    default 0;
    ~*text/html 1;
}
# 5stack static asset cache
proxy_cache_path /tmp/5stack_cache levels=1:2 keys_zone=5stack_cache:30m max_size=500m inactive=24h use_temp_path=off;
# Gzip for 5stack assets (output compression)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;




# Keepalive to laptop ingress-nginx for 5stack assets
upstream 5stack_backend {
    server 100.84.196.93:30139;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    server_name panel.zxc1x1.ru host.zxc1x1.ru;
    listen 443 ssl http2;
    listen 80;
    listen 8080;

    # Redirect HTTP to HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate "/etc/nginx/ssl/panel.zxc1x1.ru/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/panel.zxc1x1.ru/privkey.pem";

    location / {
        proxy_http_version 1.1;
        proxy_pass http://remnawave;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    server_name sub.zxc1x1.ru vk.com speedtest.net _;
    listen 443 default_server ssl http2;
    listen 8443 default_server ssl http2;
    listen 80;
    listen 8080;

    keepalive_requests 10000000;
    keepalive_timeout 3600s;
    http2_max_concurrent_streams 1024;
    client_max_body_size 0;

    # Redirect HTTP to HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate "/etc/nginx/ssl/sub.zxc1x1.ru/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/sub.zxc1x1.ru/privkey.pem";

    # Android Digital Asset Links must bypass the subscription backend.
    location = /.well-known/assetlinks.json {
        root /etc/letsencrypt/landing;
        default_type application/json;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # HTTPS App Link fallback for browsers/devices that cannot yet route the
    # verified domain to MosaicVPN. The page exposes an explicit user-click
    # custom-scheme fallback and never contains long-lived credentials.
    location = /enroll/callback {
        return 302 /enroll/callback/$is_args$args;
    }
    location ^~ /enroll/callback/ {
        root /etc/letsencrypt/landing;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }






