    server_name cs2.zxc1x1.ru cs2-api.zxc1x1.ru cs2-console.zxc1x1.ru cs2-demos.zxc1x1.ru cs2-search.zxc1x1.ru cs2-tv.zxc1x1.ru cs2-ws.zxc1x1.ru hls.cs2.zxc1x1.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name cs2.zxc1x1.ru cs2-api.zxc1x1.ru cs2-console.zxc1x1.ru cs2-demos.zxc1x1.ru cs2-search.zxc1x1.ru cs2-tv.zxc1x1.ru cs2-ws.zxc1x1.ru hls.cs2.zxc1x1.ru;

    ssl_certificate "/etc/letsencrypt/live/cs2.zxc1x1.ru/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/cs2.zxc1x1.ru/privkey.pem";
    charset utf-8;

    # Nuxt static assets — cache aggressively (ignore origin cache-control: no-cache)
    location /_nuxt/ {
        proxy_pass https://5stack_backend;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache 5stack_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_key $request_uri$http_accept_encoding;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=86400";
        proxy_read_timeout 60s;
    }

    # Image optimization
    location /_ipx/ {
        proxy_pass https://5stack_backend;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache 5stack_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key $request_uri$http_accept_encoding;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=86400";
    }

    # Favicon and robots
    location = /favicon.ico {
        proxy_pass https://100.84.196.93:30139;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_set_header Host $host;
        proxy_cache 5stack_cache;
        proxy_cache_valid 200 24h;
    }
    location = /robots.txt {
        proxy_pass https://100.84.196.93:30139;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_set_header Host $host;
        proxy_cache 5stack_cache;
        proxy_cache_valid 200 24h;
    }

    # WebSocket — no cache, long timeout, upgrade headers
    location /ws/ {
        proxy_pass https://100.84.196.93:30139;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Redirect /openhud-preview to /openhud-preview/
    location = /openhud-preview {
        return 301 /openhud-preview/;
    }

    # OpenHud Lux live preview — proxy to local Docker container
    location /openhud-preview/ {
        proxy_pass http://172.17.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Redirect /tournament-styles to /tournament-styles/
    location = /tournament-styles {
        return 301 /tournament-styles/;
    }

    # Tournament styles static files
    location /tournament-styles/ {
        alias /var/www/tournament-styles/;
        index index.html;
        autoindex on;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything else — API, HTML, websocket fallback
    location / {
        proxy_pass https://100.84.196.93:30139;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name cs2.zxc1x1.ru;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


# PROTOKOL EVENTS — protokol-events.ru
server {
    listen 80;
    listen 8080;
    server_name protokol-events.ru www.protokol-events.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name protokol-events.ru www.protokol-events.ru;

    ssl_certificate "/etc/letsencrypt/live/protokol-events.ru/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/protokol-events.ru/privkey.pem";
    charset utf-8;

