# Include inside the sub.zxc1x1.ru server block after the release gate.
# Public IndexNow ownership token; not an application credential.
location = /mosaic-indexnow-key.txt {
    root /etc/letsencrypt/landing;
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
}
