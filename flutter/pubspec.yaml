name: mosaic_vpn
description: MosaicVPN — lightweight cross-platform VPN client
publish_to: 'none'
version: 0.3.39+39

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking (daemon API)
  dio: ^5.7.0

  # System tray (desktop)
  system_tray: ^2.0.3

  # Window management (desktop)
  window_manager: ^0.4.3

  # Incoming HTTPS App Links and custom URI callbacks on desktop.
  app_links: ^7.2.1

  # Charts (traffic stats, speed test)
  fl_chart: ^0.69.2

  # Utilities
  # Flutter stable pins flutter_localizations to intl 0.20.x.
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  collection: ^1.18.0
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.4
  file_picker: ^8.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # QR decoding (pure Dart, works on Windows/Linux/macOS)
  zxing_lib: ^1.1.4
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Pulled in transitively by flutter, but map_camera_test.dart imports Vector3
  # directly to assert the transform matrix, so declare it explicitly.
  vector_math: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_adaptive.png
    - assets/maps/world.svg
    - assets/svg/
    - assets/icons/
    - assets/fonts/
