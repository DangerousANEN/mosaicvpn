# Multi-ABI sing-box/libbox runtime is deliberately bundled in each Android build.
# 3 GiB prevents zip packaging from exhausting the default 1 GiB heap on a clean CI runner.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
