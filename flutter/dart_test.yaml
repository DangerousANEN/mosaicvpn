# Test configuration.
#
# Why this exists: 13 test files call the LIVE production API
# (sub.zxc1x1.ru) to validate real subscription/candidate parsing. That is
# genuinely useful, but it makes them fail on a network hiccup, a rate limit or
# a server deploy even when the client code is correct -- and an intermittently
# red suite trains everyone to ignore it.
#
# Those files are tagged `integration` so the fast gate can stay trustworthy:
#
#   flutter test --exclude-tags integration    # fast, deterministic gate
#   flutter test --tags integration            # deliberate live probes
#
# Files are matched by filename; add new live-server tests to this list.
tags:
  integration:
    # Talks to the live production API; excluded from the fast gate.
  visual:
    # Golden-image comparison. Rendering differs between machines (font
    # rasterisation, renderer version), so a 0.2% pixel diff on a CI runner is
    # not evidence of a regression. Run and regenerate deliberately:
    #   flutter test --tags visual
    #   flutter test --update-goldens --tags visual

# Presets keep the intent explicit and discoverable.
presets:
  fast:
    exclude_tags: "integration || visual"
