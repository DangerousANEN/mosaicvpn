name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-rc53)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: android-arm64
            goos: android
            goarch: arm64
          - target: android-arm
            goos: android
            goarch: arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Android NDK
        if: startsWith(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ startsWith(matrix.target, 'android') && '1' || '0' }}
          CC: ${{ startsWith(matrix.target, 'android') && (contains(matrix.target, 'arm64') && 'aarch64-linux-android21-clang' || 'armv7a-linux-androideabi21-clang') || '' }}
        run: |
          mkdir -p dist/${{ matrix.target }}
          go build -ldflags="-s -w -X main.version=${{ github.ref_name || inputs.tag }}" \
            -o dist/${{ matrix.target }}/mosaicd${{ matrix.ext || '' }} \
            ./cmd/mosaic

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaicd-${{ matrix.target }}
          path: dist/${{ matrix.target }}/mosaicd*

  build-tauri-linux:
    name: Build Tauri (Linux)
    runs-on: ubuntu-22.04
    needs: build-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download mosaicd
        uses: actions/download-artifact@v4
        with:
          name: mosaicd-linux-amd64
          path: ui/src-tauri/binaries/

      - name: Prepare binaries
        run: |
          mkdir -p ui/src-tauri/binaries
          cp ui/src-tauri/binaries/mosaicd ui/src-tauri/binaries/mosaicd-x86_64-unknown-linux-gnu
          chmod +x ui/src-tauri/binaries/mosaicd-x86_64-unknown-linux-gnu
          # Download sing-box
          SING_VERSION="1.13.5"
          curl -L -o ui/src-tauri/binaries/sing-box \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz" | tar -xz

      - name: Build Frontend
        run: |
          cd ui
          npm install
          npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ui
          args: --target x86_64-unknown-linux-gnu
          includeDebug: false
          includeRelease: true

      - name: Rename Artifacts
        run: |
          mkdir -p dist/tauri-linux
          find ui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} dist/tauri-linux/ \;
          ls -la dist/tauri-linux/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: dist/tauri-linux/*

  build-tauri-windows:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    needs: build-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Download mosaicd
        uses: actions/download-artifact@v4
        with:
          name: mosaicd-windows-amd64
          path: ui/src-tauri/binaries/

      - name: Prepare binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ui/src-tauri/binaries
          Copy-Item ui/src-tauri/binaries/mosaicd.exe ui/src-tauri/binaries/mosaicd-x86_64-pc-windows-msvc.exe
          # Download sing-box
          $SING_VERSION = "1.13.5"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive sing-box.zip -DestinationPath .
          Copy-Item sing-box-*/sing-box.exe ui/src-tauri/binaries/
          Copy-Item ui/src-tauri/binaries/sing-box.exe ui/src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe
          # Download wintun
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath .
          Copy-Item wintun/amd64/wintun.dll ui/src-tauri/binaries/

      - name: Build Frontend
        run: |
          cd ui
          npm install
          npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ui
          args: --target x86_64-pc-windows-msvc
          includeDebug: false
          includeRelease: true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  build-tauri-macos:
    name: Build Tauri (macOS)
    runs-on: macos-latest
    needs: build-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Download mosaicd (Intel)
        uses: actions/download-artifact@v4
        with:
          name: mosaicd-darwin-amd64
          path: ui/src-tauri/binaries/

      - name: Download mosaicd (ARM64)
        uses: actions/download-artifact@v4
        with:
          name: mosaicd-darwin-arm64
          path: ui/src-tauri/binaries/

      - name: Prepare binaries
        run: |
          mkdir -p ui/src-tauri/binaries
          cp ui/src-tauri/binaries/mosaicd-darwin-amd64 ui/src-tauri/binaries/mosaicd-x86_64-apple-darwin
          cp ui/src-tauri/binaries/mosaicd-darwin-arm64 ui/src-tauri/binaries/mosaicd-aarch64-apple-darwin
          chmod +x ui/src-tauri/binaries/mosaicd-*
          # Download sing-box (universal)
          SING_VERSION="1.13.5"
          curl -L -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-darwin-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box ui/src-tauri/binaries/sing-box-x86_64-apple-darwin
          cp sing-box-*/sing-box ui/src-tauri/binaries/sing-box-aarch64-apple-darwin

      - name: Build Frontend
        run: |
          cd ui
          npm install
          npm run build

      - name: Build Tauri (Universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ui
          args: --target universal-apple-darwin
          includeDebug: false
          includeRelease: true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-go, build-tauri-linux, build-tauri-windows, build-tauri-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize Artifacts
        run: |
          mkdir -p release
          # Go binaries
          for dir in artifacts/mosaicd-*; do
            target=$(basename "$dir" | sed 's/mosaicd-//')
            cp "$dir"/mosaicd* "release/mosaicd-${target}${target#*.}"
          done
          # Tauri Linux
          cp artifacts/tauri-linux/* release/ 2>/dev/null || true
          # Tauri Windows
          cp artifacts/tauri-windows/* release/ 2>/dev/null || true
          # Tauri macOS
          cp artifacts/tauri-macos/* release/ 2>/dev/null || true
          # Rename for consistency
          cd release
          for f in *.deb; do [ -f "$f" ] && mv "$f" "MosaicVPN-linux-amd64.deb"; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" "MosaicVPN-linux-x86_64.AppImage"; done
          for f in *.msi; do [ -f "$f" ] && mv "$f" "MosaicVPN-windows-x64.msi"; done
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "MosaicVPN-macos.dmg"; done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: MosaicVPN ${{ github.ref_name || inputs.tag }}
          body: |
            ## MosaicVPN ${{ github.ref_name || inputs.tag }}

            ### Desktop
            - **Windows** (x64): `MosaicVPN-windows-x64.msi`
            - **macOS** (Universal): `MosaicVPN-macos.dmg`
            - **Linux** (x64): `MosaicVPN-linux-amd64.deb` или `MosaicVPN-linux-x86_64.AppImage`

            ### CLI (Go)
            - Linux: `mosaicd-linux-amd64`, `mosaicd-linux-arm64`
            - Windows: `mosaicd-windows-amd64.exe`, `mosaicd-windows-arm64.exe`
            - macOS: `mosaicd-darwin-amd64`, `mosaicd-darwin-arm64`
            - Android: `mosaicd-android-arm64`, `mosaicd-android-arm`

            ### Changelog
            См. [CHANGELOG.md](https://github.com/DangerousANEN/mosaicvpn/blob/main/CHANGELOG.md)
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name || inputs.tag, 'rc') || contains(github.ref_name || inputs.tag, 'beta') || contains(github.ref_name || inputs.tag, 'alpha') }}
