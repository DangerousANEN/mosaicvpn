name: release

# Builds the Tauri Windows installer with the bundled mosaicd sidecar.
# Triggered manually or on a v* tag — the resulting NSIS .exe is uploaded
# as a workflow artifact (and attached to the release on a tag push).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows-installer:
    name: Mosaic-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: build mosaicd sidecar
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path ui/src-tauri/binaries | Out-Null
          go build -ldflags="-s -w" -o ui/src-tauri/binaries/mosaicd-x86_64-pc-windows-msvc.exe ./cmd/mosaicd
          go build -ldflags="-s -w" -o bin/mosaic.exe ./cmd/mosaic

      - name: bundle sing-box sidecar (+ libcronet.dll for naive)
        shell: pwsh
        env:
          # rc49 — bumped from 1.10.7 to 1.13.7 so the bundled
          # sing-box actually understands the `naive` outbound
          # type. naive was removed from sing-box in 1.10 and
          # re-added in 1.13 via the bundled libcronet runtime;
          # 1.13.x Windows zips ship libcronet.dll alongside
          # sing-box.exe and we need both at install time.
          SINGBOX_VERSION: 1.13.7
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:SINGBOX_VERSION
          $tmp = Join-Path $env:RUNNER_TEMP "sing-box"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $zip = Join-Path $tmp "sing-box.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem -Recurse -Path $tmp -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found inside the release zip" }
          New-Item -ItemType Directory -Force -Path ui/src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName "ui/src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe"
          # libcronet.dll is the Cronet runtime that powers the
          # `naive` outbound on Windows since sing-box 1.13.0.
          # Without it sing-box will refuse to start configs that
          # reference type:"naive" with a "missing libcronet" error.
          $cronet = Get-ChildItem -Recurse -Path $tmp -Filter "libcronet.dll" | Select-Object -First 1
          if ($cronet) {
            Copy-Item $cronet.FullName "ui/src-tauri/binaries/libcronet.dll"
            Write-Host "Bundled libcronet.dll alongside sing-box.exe"
          } else {
            Write-Warning "libcronet.dll not found inside the release zip; naive outbound will not work"
          }
          Get-ChildItem ui/src-tauri/binaries

      - name: bundle wintun.dll for TUN inbound
        shell: pwsh
        env:
          WINTUN_VERSION: 0.14.1
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:WINTUN_VERSION
          $tmp = Join-Path $env:RUNNER_TEMP "wintun"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $zip = Join-Path $tmp "wintun.zip"
          $url = "https://www.wintun.net/builds/wintun-$version.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $dll = Get-ChildItem -Recurse -Path $tmp -Filter "wintun.dll" |
            Where-Object { $_.FullName -like "*amd64*" } |
            Select-Object -First 1
          if (-not $dll) { throw "amd64/wintun.dll not found inside wintun-$version.zip" }
          New-Item -ItemType Directory -Force -Path ui/src-tauri/binaries | Out-Null
          Copy-Item $dll.FullName "ui/src-tauri/binaries/wintun.dll"
          Get-ChildItem ui/src-tauri/binaries

      - name: install renderer deps
        working-directory: ui
        run: npm ci

      - name: build Tauri NSIS installer
        working-directory: ui
        env:
          # Pass the git tag (e.g. v0.1.0-rc41) into the renderer
          # bundle so UpdateBanner compares against the real release.
          # `github.ref_name` resolves to the tag name on a tag push;
          # for workflow_dispatch we leave it empty and let the
          # vite.config.ts fallback chain pick up `${pkg.version}-dev`.
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Recurse -Path ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { Copy-Item $_.FullName dist/ }
          Copy-Item bin/mosaic.exe dist/mosaic.exe
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-windows-installer
          path: dist/*

      - name: attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
