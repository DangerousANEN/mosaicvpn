name: MosaicVPN release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows-packages:
    name: Windows portable and Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Build daemon and CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = (Select-String -Path flutter/pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0] }
          go build -trimpath -ldflags="-s -w -X main.Version=$version" -o build/mosaicd.exe ./cmd/mosaicd
          if (Test-Path cmd/mosaic) { go build -trimpath -ldflags="-s -w" -o build/mosaic.exe ./cmd/mosaic }

      - name: Download and verify official sing-box
        shell: pwsh
        env:
          SINGBOX_VERSION: 1.13.18
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v$env:SINGBOX_VERSION"
          $asset = $release.assets | Where-Object { $_.name -eq "sing-box-$env:SINGBOX_VERSION-windows-amd64.zip" } | Select-Object -First 1
          if (-not $asset) { throw 'Official Windows amd64 sing-box asset was not found.' }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          $expected = $asset.digest -replace '^sha256:', ''
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sing-box checksum mismatch: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'sing-box'
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $binary = Get-ChildItem -Path $destination -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $binary) { throw 'sing-box.exe was not found in the verified asset.' }
          Copy-Item $binary.FullName build/sing-box.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build portable archive and Setup installer
        shell: pwsh
        run: |
          .\scripts\build_windows_packages.ps1 `
            -DaemonPath "$PWD\build\mosaicd.exe" `
            -SingBoxPath "$PWD\build\sing-box.exe" `
            -CliPath "$PWD\build\mosaic.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: MosaicVPN-Windows
          path: |
            dist/windows/MosaicVPN-Portable-x64-v*.zip
            dist/windows/MosaicVPN-Setup-x64-v*.exe

      - name: Attach Windows packages to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/MosaicVPN-Portable-x64-v*.zip
            dist/windows/MosaicVPN-Setup-x64-v*.exe

  linux-packages:
    name: Linux portable and DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev dpkg-dev

      - name: Build daemon
        run: |
          mkdir -p build
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="$(grep -E '^version:' flutter/pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//' | cut -d+ -f1)"; fi
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/mosaicd_linux_amd64 ./cmd/mosaicd

      - name: Download and verify official sing-box
        env:
          SINGBOX_VERSION: 1.13.18
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${SINGBOX_VERSION}"
          user_agent="MosaicVPN-release-ci"
          release_json="$(curl --retry 4 --retry-all-errors -fsSL -H "User-Agent: $user_agent" "$api")"
          url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "sing-box-'"${SINGBOX_VERSION}"'-linux-amd64-glibc.tar.gz") | .browser_download_url')"
          digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "sing-box-'"${SINGBOX_VERSION}"'-linux-amd64-glibc.tar.gz") | .digest' | sed 's/^sha256://')"
          test -n "$url" && test -n "$digest"
          curl --retry 4 --retry-all-errors -fsSL -H "User-Agent: $user_agent" "$url" -o /tmp/sing-box.tar.gz
          test "$(sha256sum /tmp/sing-box.tar.gz | awk '{print $1}')" = "$digest"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 "$(find /tmp -path '*linux-amd64-glibc/sing-box' -type f | head -1)" build/sing-box_linux_amd64

      - name: Build portable archive and DEB installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="$(grep -E '^version:' flutter/pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//' | cut -d+ -f1)"; fi
          VERSION="$VERSION" \
          SING_BOX_BINARY="$PWD/build/sing-box_linux_amd64" \
          DAEMON_BINARY="$PWD/build/mosaicd_linux_amd64" \
          ./scripts/build_linux_packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MosaicVPN-Linux
          path: |
            dist/linux/MosaicVPN-Portable-x86_64-v*.tar.gz
            dist/linux/MosaicVPN_*_amd64.deb

      - name: Attach Linux packages to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/MosaicVPN-Portable-x86_64-v*.tar.gz
            dist/linux/MosaicVPN_*_amd64.deb

  android-validation:
    name: Android branding and APK validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Install Android NDK for native VPN runtime
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build GPLv3 sing-box Android runtime
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ./scripts/build_android_libbox.sh

      - name: Restore Android release signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mosaicvpn-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/mosaicvpn-release.jks
          EOF

      - name: Build signed Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter build apk --release
          mkdir -p ../dist/android
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/android/MosaicVPN-Android-${GITHUB_REF_NAME}.apk"
          apk="../dist/android/MosaicVPN-Android-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libbox.so"
          done

      - name: Build branded debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: flutter
        run: |
          flutter build apk --debug --verbose
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libbox.so"
          done

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: MosaicVPN-Android-signed
          if-no-files-found: error
          path: dist/android/MosaicVPN-Android-v*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: MosaicVPN-Android-debug-validation
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk

      - name: Attach Android APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/MosaicVPN-Android-v*.apk
